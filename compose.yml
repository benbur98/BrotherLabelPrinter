services:
  print_server:
    container_name: print_server
    build: .
    env_file: web/.env
    environment:
      - BACKEND
      - PRINTER
      - MEDIA
      - MOTOR_INITIAL
      - MOTOR_FINAL
    ports:
      - "80:80"
    privileged: true
    volumes:
      - /sys/class/pwm:/sys/class/pwm
      - type: bind
        source: /dev
        target: /dev
        bind:  # run once on the device `sudo mount --make-rshared /`
          propagation: rshared # USB Printer hotplug: new /dev/bus/usb nodes propagate in
    restart: always
